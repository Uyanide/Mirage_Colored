<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">
    <title>幻影工厂+</title>
</head>

<body class="backgroundPrimary">
    <div id="content" class="displayFlexColumn marginTopHigh backgroundPrimary frontColor">

        <div class="displayFlexRow fontMedium marginTopMedium frontSecondaryColor">
            <div id="downloadHtmlLink" class="textDecorationUnderline frontLinkColor transformSize"></div>
            <div class="frontSecondaryColor fontSmall marginLeftLow"></div>
        </div>

        <div class="switchContainer displayFlexRow paddingHigh backgroundSecondary" id="isDarkmodeContainer">
            <div id="isDarkModeLabel" class="marginRightLow fontMedium">关灯</div>
            <label class="switch">
                <input type="checkbox" id="isDarkmodeCheckbox">
                <span class="switchSlider"></span>
            </label>
        </div>

        <div class="DisplayArea displayFlexColumn refWidthFull marginTopHigh">
            <div
                class="PageContainer borderRadiusExtreme fontMedium frontColor displayFlexColumn refWidthHigh backgroundSecondary paddingHigh">
                <div class="RowContainer refWidthHigh displayFlexRow justifySpaceBetween marginTopHigh">
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <div class="marginBottomMedium">
                            <label for="innerFileInput" class="inputReact transformSize" style="display: none;">选择里图文件</label>
                            <input type="file" id="innerFileInput" accept="*/*">
                        </div>
                        <div id="innerInputHint" style="display: none;"></div>
                        <div class="canvasWrapper positionRelative refWidthFull marginTopMedium">
                            <canvas id="innerCanvas" class="refWidthFull"></canvas>
                            <div id="innerCanvasLabel" class="canvasLabel frontSecondaryColor fontSmall">点击选择里图</div>
                        </div>
                    </div>
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <div class="marginBottomMedium">
                            <label for="coverFileInput" class="inputReact transformSize" style="display: none;">选择表图文件</label>
                            <input type="file" id="coverFileInput" accept="*/*">
                        </div>
                        <div id="coverInputHint" style="display: none;"></div>
                        <div class="canvasWrapper positionRelative refWidthFull marginTopMedium">
                            <canvas id="coverCanvas" class="refWidthFull"></canvas>
                            <div id="coverCanvasLabel" class="canvasLabel frontSecondaryColor fontSmall">点击选择表图</div>
                        </div>
                    </div>
                </div>
                <div class="RowContainer refWidthHigh displayFlexRow justifySpaceBetween marginTopHigh">
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <div class="switchContainer">
                            <div class="marginRightLow fontMedium">全彩输出</div>
                            <label class="switch">
                                <input type="checkbox" id="isColoredCheckbox">
                                <span class="switchSlider"></span>
                            </label>
                        </div>
                        <hr class="refWidthHigh marginTopMedium marginBottomMedium">
                        <button id="swapButton" class="inputReact transformSize">表里图互换</button>
                        <hr class="refWidthHigh marginTopMedium marginBottomMedium">
                        <div>
                            <div>
                                输出图片尺寸:
                                <input type="number" id="maxSizeInput" class="inputReact marginTopLow" min="1" max="4096">
                            </div>
                            <div style="margin-top: 6px;">
                                <span class="marginLeftLow">文件大小上限:</span>
                                <input type="number" id="maxFileSizeInput" class="inputReact marginLeftLow" min="0" max="128" value="5" step="1">
                            </div>
                        </div>
                        <hr class="refWidthHigh marginTopMedium marginBottomMedium">
                        <div class="">里图混色权重</div>
                        <input type="range" id="innerWeightRange" class="refWidthHigh marginTopLow" min="0" max="100"
                            step="2">
                        <div class="marginTopLow displayFlexRow alignCenter gapLow">
                            <button id="innerWeightMinus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&lt;</button>
                            <input type="number" id="innerWeightInput" class="inputReact" step="0.02">
                            <button id="innerWeightPlus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&gt;</button>
                        </div>
                    </div>
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <canvas id="outputCanvas" class="refWidthFull marginTopMedium"></canvas>
                        <div class="marginTopLow fontSmall frontColor" id="fileSizePreview">文件大小：</div>
                        <button id="saveButton" class="inputReact transformSize marginTopHigh">保存结果</button>
                    </div>
                </div>
                <div
                    class="RowContainer refWidthHigh displayFlexRow justifySpaceBetween marginTopHigh marginBottomHigh">
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <canvas id="blackCanvas" class="refWidthFull marginTopMedium"></canvas>
                        <div class="marginTopMedium">里图亮度</div>
                        <input type="range" id="innerScaleRange" class="refWidthHigh marginTopLow" min="0" max="100"
                            step="2">
                        <div class="marginTopLow displayFlexRow alignCenter gapLow">
                            <button id="innerScaleMinus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&lt;</button>
                            <input type="number" id="innerScaleInput" class="inputReact" step="0.02">
                            <button id="innerScalePlus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&gt;</button>
                        </div>
                        <hr class="refWidthHigh marginTopMedium marginBottomMedium">
                        <div class="">里图去色</div>
                        <input type="range" id="innerDesatRange" class="refWidthHigh marginTopLow" min="0" max="100"
                            step="2">
                        <div class="marginTopLow displayFlexRow alignCenter gapLow">
                            <button id="innerDesatMinus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&lt;</button>
                            <input type="number" id="innerDesatInput" class="inputReact" step="0.02">
                            <button id="innerDesatPlus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&gt;</button>
                        </div>
                    </div>
                    <div class="CanvasContainer displayFlexColumn paddingMedium refWidthHalf">
                        <canvas id="whiteCanvas" class="refWidthFull marginTopMedium"></canvas>
                        <div class="marginTopMedium">表图亮度</div>
                        <input type="range" id="coverScaleRange" class="refWidthHigh marginTopLow" min="0" max="100"
                            step="2">
                        <div class="marginTopLow displayFlexRow alignCenter gapLow">
                            <button id="coverScaleMinus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&lt;</button>
                            <input type="number" id="coverScaleInput" class="inputReact" step="0.02">
                            <button id="coverScalePlus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&gt;</button>
                        </div>
                        <hr class="refWidthHigh marginTopMedium marginBottomMedium">
                        <div class="">表图去色</div>
                        <input type="range" id="coverDesatRange" class="refWidthHigh marginTopLow" min="0" max="100"
                            step="2">
                        <div class="marginTopLow displayFlexRow alignCenter gapLow">
                            <button id="coverDesatMinus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&lt;</button>
                            <input type="number" id="coverDesatInput" class="inputReact" step="0.02">
                            <button id="coverDesatPlus" class="inputReact transformSize" style="width: auto; padding: 5px 8px;">&gt;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="pageBelow" class="displayFlex frontColor justifyCenter alignCenter flexColumn marginTopHigh">
            <div class="marginTopMedium marginBottomMedium">
                <table id="versionRecordTable"
                    class="fontSmall paddingHigh borderRadiusExtreme displayNone backgroundSecondary borderCollapse frontColor">
                    <tbody>
                        <tr>
                            <td>1.0.0</td>
                            <td>初始版本。
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
